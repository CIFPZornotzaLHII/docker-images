<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <title>El mapa: de la receta al contenedor</title>
  <style>
    .s { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .m { font-family: Consolas, ui-monospace, Menlo, monospace; }
  </style>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text class="s" x="28" y="44" font-size="22" font-weight="700" fill="#111827">El mapa: de la receta al contenedor</text>
  <text class="s" x="28" y="68" font-size="13" fill="#6b7280">Los colores se repiten en todos los diagramas: naranja = Dockerfile · azul = imagen · verde = contenedor · morado = registro</text>

  <!-- ===== Registro ===== -->
  <rect x="370" y="96" width="220" height="64" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="s" x="480" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">Docker Hub</text>
  <text class="s" x="480" y="146" text-anchor="middle" font-size="12.5" fill="#6b7280">registro: almacén de imágenes</text>

  <!-- ===== Dockerfile ===== -->
  <rect x="40" y="214" width="220" height="140" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="s" x="60" y="242" font-size="16" font-weight="700" fill="#9a3412">Dockerfile</text>
  <g class="m" font-size="12.5" fill="#111827">
    <text x="60" y="268">FROM nginx:alpine</text>
    <text x="60" y="288">COPY web/ /usr/share/…</text>
    <text x="60" y="308">EXPOSE 80</text>
  </g>
  <text class="s" x="60" y="338" font-size="12.5" fill="#6b7280">la receta: un fichero de texto</text>

  <!-- ===== Imagen ===== -->
  <rect x="370" y="214" width="220" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="s" x="390" y="242" font-size="16" font-weight="700" fill="#1e40af">Imagen</text>
  <g stroke="#60a5fa" stroke-width="1.5">
    <rect x="390" y="254" width="180" height="18" rx="4" fill="#dbeafe"/>
    <rect x="390" y="276" width="180" height="18" rx="4" fill="#dbeafe"/>
    <rect x="390" y="298" width="180" height="18" rx="4" fill="#bfdbfe"/>
  </g>
  <g class="m" font-size="11.5" fill="#1e3a8a">
    <text x="398" y="267">COPY web/  (tu web)</text>
    <text x="398" y="289">nginx</text>
    <text x="398" y="311">alpine  (la base)</text>
  </g>
  <text class="s" x="390" y="338" font-size="12.5" fill="#6b7280">la plantilla: solo lectura</text>

  <!-- ===== Contenedor (con otro detrás: puede haber muchos) ===== -->
  <rect x="708" y="206" width="220" height="140" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="700" y="214" width="220" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="s" x="720" y="242" font-size="16" font-weight="700" fill="#166534">Contenedor</text>
  <circle cx="725" cy="264" r="5" fill="#16a34a"/>
  <text class="m" x="737" y="268" font-size="12.5" fill="#111827">web1 · en marcha</text>
  <text class="m" x="720" y="290" font-size="12.5" fill="#111827">localhost:8080 → 80</text>
  <rect x="720" y="300" width="180" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="s" x="728" y="313" font-size="11.5" fill="#166534">+ su capa de escritura</text>
  <text class="s" x="720" y="338" font-size="12.5" fill="#6b7280">una instancia en marcha</text>

  <!-- ===== Flechas ===== -->
  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <line x1="262" y1="284" x2="368" y2="284"/>
    <line x1="592" y1="284" x2="698" y2="284"/>
    <line x1="450" y1="212" x2="450" y2="162"/>
    <line x1="510" y1="162" x2="510" y2="212"/>
    <path d="M810,356 V394 H480 V358" stroke-dasharray="6 5"/>
  </g>
  <g class="m" font-size="13" font-weight="700" fill="#111827">
    <text x="315" y="274" text-anchor="middle">docker build</text>
    <text x="645" y="274" text-anchor="middle">docker run</text>
    <text x="440" y="192" text-anchor="end">docker push</text>
    <text x="520" y="192">docker pull</text>
    <text x="645" y="386" text-anchor="middle">docker commit</text>
  </g>
  <g class="s" font-size="12" fill="#6b7280">
    <text x="315" y="302" text-anchor="middle">Parte 3</text>
    <text x="645" y="302" text-anchor="middle">Parte 1</text>
    <text x="440" y="208" text-anchor="end">Reto 2</text>
    <text x="520" y="208">Parte 1</text>
    <text x="645" y="416" text-anchor="middle">una «foto» de un contenedor · Parte 2</text>
  </g>
</svg>
