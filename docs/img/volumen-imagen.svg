<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Volumen o imagen: ¿qué ve cada contenedor?</title>
  <style>
    .s { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .m { font-family: Consolas, ui-monospace, Menlo, monospace; }
  </style>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="439" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text class="s" x="28" y="44" font-size="22" font-weight="700" fill="#111827">Acabas de cambiar index.html a la versión 2.0. ¿Qué ve cada contenedor?</text>

  <!-- ===== Fila 1: volumen ===== -->
  <text class="s" x="40" y="94" font-size="16" font-weight="700" fill="#111827">Volumen = una ventana <tspan class="m" font-size="13" font-weight="400" fill="#4b5563">(-v)</tspan></text>

  <rect x="40" y="110" width="210" height="84" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="s" x="56" y="136" font-size="15" font-weight="700" fill="#111827">Tu carpeta</text>
  <text class="m" x="56" y="158" font-size="12" fill="#4b5563">mi-web/web/index.html</text>
  <text class="s" x="56" y="180" font-size="13" font-weight="700" fill="#15803d">Versión 2.0</text>

  <line x1="254" y1="152" x2="646" y2="152" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#flecha)"/>
  <text class="s" x="450" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111827">el contenedor mira tu carpeta</text>
  <text class="s" x="450" y="174" text-anchor="middle" font-size="12.5" fill="#6b7280">no hay copia: son los mismos ficheros</text>

  <rect x="650" y="110" width="270" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="m" x="666" y="136" font-size="15" font-weight="700" fill="#166534">web-vol</text>
  <text class="m" x="666" y="158" font-size="12" fill="#4b5563">localhost:8084</text>
  <text class="s" x="666" y="180" font-size="13" fill="#111827">Muestra la <tspan font-weight="700" fill="#15803d">versión 2.0</tspan></text>

  <!-- ===== Fila 2: imagen ===== -->
  <text class="s" x="40" y="246" font-size="16" font-weight="700" fill="#111827">Imagen = una foto <tspan class="m" font-size="13" font-weight="400" fill="#4b5563">(COPY en el Dockerfile)</tspan></text>

  <rect x="40" y="262" width="210" height="84" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text class="s" x="56" y="288" font-size="15" font-weight="700" fill="#111827">Tu carpeta</text>
  <text class="m" x="56" y="310" font-size="12" fill="#4b5563">mi-web/web/index.html</text>
  <text class="s" x="56" y="332" font-size="13" font-weight="700" fill="#15803d">Versión 2.0</text>

  <line x1="254" y1="304" x2="366" y2="304" stroke="#4b5563" stroke-width="2" marker-end="url(#flecha)"/>
  <text class="m" x="310" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">docker build</text>
  <text class="s" x="310" y="324" text-anchor="middle" font-size="12" fill="#6b7280">lo hiciste antes</text>
  <text class="s" x="310" y="340" text-anchor="middle" font-size="12" fill="#6b7280">del cambio</text>

  <rect x="370" y="262" width="180" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="m" x="386" y="288" font-size="14" font-weight="700" fill="#1e40af">mi-web:1.0</text>
  <text class="s" x="386" y="310" font-size="12" fill="#4b5563">guarda la foto de entonces</text>
  <text class="s" x="386" y="332" font-size="13" font-weight="700" fill="#b91c1c">Versión 1.0</text>

  <line x1="554" y1="304" x2="646" y2="304" stroke="#4b5563" stroke-width="2" marker-end="url(#flecha)"/>
  <text class="m" x="600" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">docker run</text>

  <rect x="650" y="262" width="270" height="84" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="m" x="666" y="288" font-size="15" font-weight="700" fill="#166534">web-img</text>
  <text class="m" x="666" y="310" font-size="12" fill="#4b5563">localhost:8090</text>
  <text class="s" x="666" y="332" font-size="13" fill="#111827">Sigue en la <tspan font-weight="700" fill="#b91c1c">versión 1.0</tspan></text>

  <!-- ===== Pie ===== -->
  <g class="s" font-size="13.5" fill="#374151">
    <text x="40" y="388"><tspan font-weight="700">Volumen:</tspan> ves los cambios al recargar, pero solo funciona donde esté tu carpeta.</text>
    <text x="40" y="412"><tspan font-weight="700">Imagen:</tspan> lleva la web dentro y funciona en cualquier equipo, pero hay que reconstruirla para actualizarla.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
