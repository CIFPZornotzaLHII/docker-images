<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
  <title>Multi-stage: compilar en grande, ejecutar en pequeño</title>
  <style>
    .s { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .m { font-family: Consolas, ui-monospace, Menlo, monospace; }
  </style>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="429" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text class="s" x="28" y="44" font-size="22" font-weight="700" fill="#111827">Multi-stage: compilar en grande, ejecutar en pequeño</text>

  <!-- ===== Etapa 1 ===== -->
  <rect x="40" y="76" width="460" height="274" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="s" x="60" y="106" font-size="16" font-weight="700" fill="#374151">Etapa 1 · compilador</text>
  <text class="m" x="60" y="128" font-size="12.5" fill="#9a3412">FROM golang:1.26 AS compilador</text>

  <g fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5">
    <rect x="60" y="146" width="128" height="34" rx="6"/>
    <rect x="196" y="146" width="128" height="34" rx="6"/>
    <rect x="332" y="146" width="148" height="34" rx="6"/>
  </g>
  <g class="s" font-size="13" fill="#374151" text-anchor="middle">
    <text x="124" y="168">compilador Go</text>
    <text x="260" y="168">librerías</text>
    <text x="406" y="168">herramientas (git…)</text>
  </g>

  <g fill="#fff7ed" stroke="#fdba74" stroke-width="1.5">
    <rect x="60" y="208" width="100" height="34" rx="6"/>
    <rect x="168" y="208" width="100" height="34" rx="6"/>
  </g>
  <g class="m" font-size="13" fill="#111827" text-anchor="middle">
    <text x="110" y="230">main.go</text>
    <text x="218" y="230">go.mod</text>
  </g>
  <line x1="272" y1="225" x2="350" y2="225" stroke="#4b5563" stroke-width="2" marker-end="url(#flecha)"/>
  <text class="m" x="311" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">go build</text>
  <rect x="354" y="208" width="126" height="34" rx="6" fill="#1f2937"/>
  <text class="m" x="417" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">hola</text>
  <text class="s" x="417" y="260" text-anchor="middle" font-size="11.5" fill="#6b7280">el programa compilado</text>

  <g class="s" font-size="12.5" fill="#6b7280">
    <text x="60" y="290">Todo esto hace falta para compilar…</text>
    <text x="60" y="308">…pero no para ejecutar el programa.</text>
  </g>
  <text class="s" x="60" y="334" font-size="15" font-weight="700" fill="#b91c1c">≈ 1,4 GB <tspan font-size="12.5" font-weight="400" fill="#6b7280">· se descarta al terminar</tspan></text>

  <!-- ===== Copia ===== -->
  <line x1="482" y1="225" x2="688" y2="225" stroke="#4b5563" stroke-width="2" marker-end="url(#flecha)"/>
  <text class="m" x="606" y="212" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">COPY --from=compilador</text>
  <text class="m" x="606" y="244" text-anchor="middle" font-size="12" fill="#4b5563">/hola /hola</text>

  <!-- ===== Etapa 2 ===== -->
  <rect x="690" y="140" width="230" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="s" x="710" y="168" font-size="16" font-weight="700" fill="#1e40af">Imagen final</text>
  <text class="m" x="710" y="190" font-size="12.5" fill="#9a3412">FROM scratch</text>
  <rect x="740" y="208" width="126" height="34" rx="6" fill="#1f2937"/>
  <text class="m" x="803" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">hola</text>
  <text class="s" x="710" y="276" font-size="15" font-weight="700" fill="#1e40af">≈ 13 MB</text>
  <text class="s" x="710" y="296" font-size="12.5" fill="#6b7280">solo tu programa</text>

  <!-- ===== Pie ===== -->
  <text class="s" x="40" y="384" font-size="13.5" fill="#374151"><tspan class="m">scratch</tspan> es una imagen vacía: ni siquiera trae sistema operativo. Solo cabe un programa que no necesita nada más.</text>
  <text class="s" x="40" y="406" font-size="12.5" fill="#6b7280">Tamaños medidos con <tspan class="m">docker image ls</tspan>; en tu equipo pueden variar un poco.</text>
</svg>
